name: Frontend CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. 拉取源码
      - name: Checkout source
        uses: actions/checkout@v7

      # 2. 设置 Node.js & 缓存依赖
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 3. 安装依赖并构建
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type check and build
        run: npm run build:check

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: check
    # PR 只跑检查，不部署。
    if: github.event_name != 'pull_request'

    steps:
      # No server yet: only deploy when the SSH secrets are all set.
      # This step never fails; it only records whether deployment can run.
      - name: Check deploy secrets
        id: secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets are set; continuing with deployment."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets (SSH_HOST / SSH_USER / SSH_KEY) are not all set; skipping deployment."
          fi

      # 1. 拉取源码
      - name: Checkout source
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v7

      # 2. 设置 Node.js & 缓存依赖
      - name: Setup Node.js
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache npm
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 3. 安装依赖并构建
      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Type check and build
        if: steps.secrets.outputs.ready == 'true'
        run: npm run build:check

      # 4. 压缩 dist 目录
      - name: Compress dist folder
        if: steps.secrets.outputs.ready == 'true'
        run: |
          tar -czf dist.tar.gz -C dist .

      # 5. 上传文件到服务器
      - name: Preflight - SSH handshake check
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -vvv ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo SSH_OK"

      - name: Upload dist.tar.gz to server
        if: steps.secrets.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist.tar.gz"
          target: "/tmp"
          timeout: 120s
          command_timeout: 120s
          debug: true
          use_insecure_cipher: true

      # 6. 在服务器端清空目标目录并解压新文件
      - name: Deploy on server via SSH
        if: steps.secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="${TARGET_DIR:-/www/zeno/frontend/dist}"
            TMP_FILE="/tmp/dist.tar.gz"

            echo "==> 检查部署包是否存在：$TMP_FILE"
            if [ ! -f "$TMP_FILE" ]; then
              echo "❌ 未找到部署包 $TMP_FILE，终止部署（不会清空线上目录）"
              echo "==> /tmp 目录文件列表："
              ls -lh /tmp | head -n 50 || true
              exit 1
            fi

            # 创建部署目录（如果不存在）
            sudo mkdir -p "$DEPLOY_DIR"

            # 清空目录（保留目录本身）
            echo "==> 清理旧文件"
            sudo find "$DEPLOY_DIR" -mindepth 1 -delete

            # 解压新文件
            echo "==> 解压新版本"
            sudo tar -xzf "$TMP_FILE" -C "$DEPLOY_DIR" --strip-components=0

            # 设置正确的权限
            echo "==> 设置权限"
            sudo chown -R nginx:nginx "$DEPLOY_DIR"
            sudo chmod -R 755 "$DEPLOY_DIR"

            # 清理临时文件
            sudo rm -f "$TMP_FILE"

            # 重新加载 Nginx
            echo "==> 重新加载 Nginx..."
            sudo systemctl reload nginx || true

            echo "✅ 部署完成！"
